<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4f8">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/app.js"></script>
  <title>Settings — Freindz</title>
  <meta name="description" content="Make Freindz feel like your own space.">
</head>
<body>
  <div id="site-header"></div>
  <main class="container inner-page">
    
<section class="page-heading"><span class="eyebrow">MAKE YOURSELF AT HOME</span><h1>Settings <span>⚙️</span></h1><p>Change the look, colors, and background sound.</p></section>
<section class="panel"><span class="eyebrow">THE LOOK</span><h2>Background theme</h2><div class="theme-grid">
  <button class="theme-choice" data-theme="light"><span>☀️</span><strong>Light</strong><small>Soft and bright</small></button>
  <button class="theme-choice" data-theme="dark"><span>🌙</span><strong>Dark</strong><small>Easy on the eyes</small></button>
  <button class="theme-choice" data-theme="rainbow"><span>🌈</span><strong>Color flow</strong><small>Slowly changing colors</small></button>
</div></section>
<section class="panel"><span class="eyebrow">YOUR PALETTE</span><h2>Choose your colors 🎨</h2><div class="color-grid">
  <label>Background<input type="color" id="colorBg" value="#fff4f8"></label><label>Cards<input type="color" id="colorCard" value="#ffffff"></label><label>Text<input type="color" id="colorText" value="#392a3d"></label><label>Accent<input type="color" id="colorPrimary" value="#e95b91"></label><label>Soft accent<input type="color" id="colorSecondary" value="#ffe1ec"></label><label>Borders<input type="color" id="colorBorder" value="#f1d9e4"></label>
</div><button class="button button-soft" id="resetColors" type="button">Reset colors</button></section>
<section class="panel music-panel"><div><span class="eyebrow">SET THE MOOD</span><h2>Background music 🎵</h2><p class="muted">Original melodies are generated by your browser. Start playback with the button below.</p></div>
  <div class="music-controls"><label>Choose a melody<select id="musicSelect"><option value="none">No music</option><option value="chill">Soft & chill</option><option value="happy">Happy day</option><option value="lofi">Lo-fi tones</option></select></label><label>Volume <strong id="volumeValue">30%</strong><input type="range" id="volume" min="0" max="100" value="30"></label><button class="button" id="musicToggle" type="button">Play music</button></div>
</section>

  </main>
  <div id="site-footer"></div>
  <script defer src="assets/js/settings.js"></script>
</body>
</html>
